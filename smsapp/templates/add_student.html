{% extends 'navbar.html' %}

{% block content %}
<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }
    .page-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin: 0;
    }
    .breadcrumb {
        background: transparent;
        padding: 0;
        margin: 0;
        font-size: 0.85rem;
        color: #64748b;
    }
    .breadcrumb-item a {
        color: #64748b;
        text-decoration: none;
    }
    .breadcrumb-item.active {
        color: #4f46e5;
        font-weight: 600;
    }
    .breadcrumb-item + .breadcrumb-item::before {
        content: "/";
        color: #cbd5e1;
    }
    .card-custom {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        border: none;
        padding: 30px;
    }
    .card-header-custom {
        display: flex;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid #f1f5f9;
    }
    .card-header-custom i {
        background-color: #4f46e5;
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 15px;
    }
    .card-header-custom h5 {
        margin: 0;
        font-weight: 600;
        color: #4f46e5;
        font-size: 1.1rem;
    }
    .form-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }
    .input-group-text {
        background-color: transparent;
        border-right: none;
        color: #94a3b8;
    }
    .form-control {
        border-left: none;
    }
    .form-control:focus {
        border-color: #e2e8f0; /* overriding global since input-group handles focus */
    }
    .input-group:focus-within {
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        border-radius: 6px;
    }
    .input-group:focus-within .form-control, .input-group:focus-within .input-group-text {
        border-color: #818cf8;
    }
    .btn-outline-custom {
        background-color: white;
        border: 1px solid #e2e8f0;
        color: #64748b;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 8px;
        transition: all 0.2s;
    }
    .btn-outline-custom:hover {
        background-color: #f1f5f9;
        color: #334155;
    }
    .btn-primary-custom {
        background-color: #4f46e5;
        border: none;
        color: white;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 8px;
        transition: all 0.2s;
    }
    .btn-primary-custom:hover {
        background-color: #4338ca;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
</style>

<div class="page-header">
    <h2 class="page-title">Add Student Details</h2>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#"><i class="fas fa-home"></i></a></li>
            <li class="breadcrumb-item"><a href="#">Students</a></li>
            <li class="breadcrumb-item active" aria-current="page">Add Student</li>
        </ol>
    </nav>
</div>

{% if error_message %}
    <div class="alert alert-danger">{{ error_message }}</div>
{% endif %}
{% if success_message %}
    <div class="alert alert-success">{{ success_message }}</div>
{% endif %}

<div class="card-custom">
    <div class="card-header-custom">
        <i class="far fa-user"></i>
        <h5>Student Information</h5>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="far fa-user"></i></span>
                        </div>
                        <input type="text" name="full_name" class="form-control" placeholder="Enter full name" value="{{ student.full_name|default:'' }}" required>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Father's Name</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="far fa-user"></i></span>
                        </div>
                        <input type="text" name="father_name" class="form-control" placeholder="Enter father's name" value="{{ student.father_name|default:'' }}" required>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Mother's Name</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="far fa-user"></i></span>
                        </div>
                        <input type="text" name="mother_name" class="form-control" placeholder="Enter mother's name" value="{{ student.mother_name|default:'' }}" required>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Age</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="far fa-calendar-alt"></i></span>
                        </div>
                        <input type="number" name="age" class="form-control" placeholder="Enter age" value="{{ student.age|default:'' }}" required>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Gender</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-venus-mars"></i></span>
                        </div>
                        <select name="gender" class="form-control" required>
                            <option value="" disabled {% if not student %}selected{% endif %}>Select gender</option>
                            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Class / Course</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-graduation-cap"></i></span>
                        </div>
                        <select name="course_name" class="form-control" required>
                            <option value="" disabled {% if not student %}selected{% endif %}>Select class or course</option>
                            {% for course in courses %}
                                <option value="{{ course.id }}" {% if student and student.course_name.id == course.id %}selected{% endif %}>{{ course.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Admission Date</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="far fa-calendar-alt"></i></span>
                        </div>
                        <input type="date" name="admission_date" class="form-control" value="{{ student.admission_date|date:'Y-m-d' }}" required>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Admission Number</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                        </div>
                        <input type="text" name="admission_number" class="form-control" placeholder="Enter admission number" value="{{ student.admission_number|default:'' }}" required>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Scholarship</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-award"></i></span>
                        </div>
                        <select name="scholarship" class="form-control">
                            <option value="" disabled {% if not student.scholarship %}selected{% endif %}>Select</option>
                            <option value="E-grants" {% if student.scholarship == 'E-grants' %}selected{% endif %}>E-grants</option>
                            <option value="postgraduate" {% if student.scholarship == 'postgraduate' %}selected{% endif %}>Postgraduate</option>
                            <option value="graduate" {% if student.scholarship == 'graduate' %}selected{% endif %}>Graduate</option>
                            <option value="single girl child" {% if student.scholarship == 'single girl child' %}selected{% endif %}>Single Girl Child</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label>Hosteler</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-building"></i></span>
                        </div>
                        <select name="hosteler" class="form-control" required>
                            <option value="" disabled {% if not student %}selected{% endif %}>Select</option>
                            <option value="True" {% if student.hosteler == True %}selected{% endif %}>Yes</option>
                            <option value="False" {% if student.hosteler == False %}selected{% endif %}>No</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-12 mb-4">
                <div class="form-group">
                    <label>Address</label>
                    <div class="input-group">
                        <div class="input-group-prepend" style="align-items: flex-start;">
                            <span class="input-group-text" style="height: 100%; border-radius: 6px 0 0 6px;"><i class="fas fa-map-marker-alt" style="margin-top: 10px;"></i></span>
                        </div>
                        <textarea name="address" class="form-control" rows="3" placeholder="Enter full address" required>{{ student.address|default:'' }}</textarea>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="d-flex justify-content-end mt-2">
            <button type="reset" class="btn-outline-custom mr-3"><i class="fas fa-undo mr-2"></i> Reset</button>
            <button type="submit" class="btn-primary-custom"><i class="fas fa-save mr-2"></i> Save Student</button>
        </div>
    </form>
</div>
{% endblock %}
