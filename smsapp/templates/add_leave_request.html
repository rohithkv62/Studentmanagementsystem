{% extends 'navbar.html' %}
{% block content %}

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="far fa-calendar-plus text-primary"></i> Apply for Leave</h2>
            </div>

            {% if messages %}
                <div class="mb-3">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="card shadow border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 text-secondary">Leave Request Details</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="subject" class="form-label fw-bold text-secondary">Reason / Subject</label>
                            <input type="text" id="subject" name="subject" class="form-control" placeholder="Brief reason for your leave..." maxlength="100" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="from_date" class="form-label fw-bold text-secondary">From Date</label>
                                <input type="date" id="from_date" name="from_date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="to_date" class="form-label fw-bold text-secondary">To Date</label>
                                <input type="date" id="to_date" name="to_date" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-end mt-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-paper-plane"></i> Submit Request
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
